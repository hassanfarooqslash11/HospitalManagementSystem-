<!DOCTYPE html>


<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>City Hospital LoginPage</title>

    <style>

        body{

            background-color: azure;
            /* overflow-x: hidden; */
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        header{

            width: 100%;
            height: 50px;
            position: relative;
            top: 0;
            left: 0;
            background-color: white;
            margin-top: -2%;
           
            
        }
        header p{
            color: darkgreen;
            font-weight: 800;

        }
        header p a{

            color: royalblue;
            font-style: none;
            font-family: monospace;
            margin-left: 89%;
            top: -5px;
        }
        .leftside{

            background-color: darkcyan;
            width: 39%;
            height: 65%;
            margin-top: 45px;
            border: 1px solid black;
            border-radius: 3%;
            margin-left: 4%;
        }
        .leftside h1{

            margin-left: 20%;
            margin-top: 60px;
            font-weight: 900;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: aliceblue;
        }
        .leftside p{

            margin-top: 50px;
            margin-left: 15%;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            color: azure;
          

        }
        .rightside{
            background-color: darkgray;
             margin-left: 50%;
             margin-top: -32%;
             width: 39%;
            height: 65%;
            border-radius: 15px;

        }
        .rightside h2{

            margin-left: 5%;
            font-weight: 900;
            font-style: oblique;
            font-family: 'Courier New', Courier, monospace;
        }
        .rightside form label{

            margin-left: 25px;
            font-style: oblique;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow';
            font-weight: 600;
            color: darkblue;

            
        }
        .rightside form input{

            width: 180px;
            height: 25px;
            background-color: azure;
            border-radius: 8px;
            border: 1.55px solid white;
            margin-left: 23px;
            
        }
        .rightside form a{

            margin-left: 60%;
            color: ghostwhite;
        }
        .rightside form button{
           
             
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-display: swap;
            background-color: rgb(0, 255, 68);
            border-radius: 12%;
             margin-left: 40%;
             
            
             
        }
        .rightside form p{

            text-align: center;
            margin-left: 38px;
            font-weight: 900;
            color: dodgerblue;
        }
        .rightside form p a{
            margin-left: 7.9px;
            color: blue;
        }

    </style>

</head>

<body>

    <header>
       <p>
         <button style="background-color: green; margin-top: 20px;
         margin-left: 5%;border-radius: 6px;">+</button> City Hospital
         <a href="home.html">Back to home</a> 
      </p>
    </header>

    <div class="leftside">

        <h1>Welcome Back</h1>
        <p>Get your appointment at home</p>
        <p>Download your reports online</p>
        <p>Register and get services online</p>
        <p>We care of your health</p>
       
    </div>
    
    <div class="rightside">
        <h2>Login</h2>
        <form action="submit">

            
            <label for="username">
                Enter your username
            </label>
            <br><br>
            <input type="text" placeholder="example@gmail.com">
            <br><br>
             <label for="username">
                Enter your password
            </label>
            <br><br>
            <input type="text" placeholder="password">
            <br><br>

            <a href="forgetpage">Forget  password?</a>
            <br>
            <button id="getmein" style="height: 40px; width: 15%;">Login</button>
            <br><br>

            <p>New here ? <br> <a href="">Register</a></p>
            <br>
        
        </form>
    </div>


</body>
</html>
