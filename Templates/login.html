<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Hospital Login</title>
<style>
body { background: url("/static/hospitallogin.png") no-repeat center center fixed; background-size: cover; min-height: 100vh; margin: 0; font-family: Arial, sans-serif; }
.logindesign { position: absolute; top: 55%; left: 60%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.9); padding: 25px; border-radius: 18px; box-shadow: 0 8px 25px rgba(20,45,78,0.35); width: 300px; min-height: 350px; border-top: 5px solid #008C95; }
h1 { text-align: center; font-size: 27px; color: #142D4E; }
h2 { text-align: center; color: #142D4E; }
h3 { font-size: 32px; text-align: center; font-family: Georgia, serif; color: #008C95; }
button { display: block; width: 100%; padding: 12px; margin: 10px 0; font-size: 17px; font-weight: bold; background: #142D4E; color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
button:hover { background: #008C95; transform: scale(1.04); }
input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
.backbtn { background: #888; }
#patientForm, #staffForm, #patientRegister, #staffRegister { display: none; }
</style>
</head>
<body>
<div class="logindesign">

  <div id="roleBox">
    <h1>Welcome to City Hospital</h1>
    <h3>I Am The</h3>
    <button onclick="show('patientForm')">Patient</button>
    <button onclick="show('staffForm')">Staff</button>
    <h3>Of City Hospital</h3>
  </div>

  <div id="patientForm">
    <h2>Patient Login</h2>
    <form action="/patient_login" method="POST">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <button type="button" onclick="show('patientRegister')">Don't have an account? Sign Up</button>
    <button type="button" class="backbtn" onclick="show('roleBox')">Back</button>
  </div>

  <div id="staffForm">
    <h2>Staff Login</h2>
    <form action="/staff_login" method="POST">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <button type="button" onclick="show('staffRegister')">New staff? Register</button>
    <button type="button" class="backbtn" onclick="show('roleBox')">Back</button>
  </div>

  <div id="patientRegister">
    <h2>Registration</h2>
    <form action="/patient_register" method="POST" onsubmit="return checkPass(this)">
      <input type="text" name="name" placeholder="Your name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="tel" name="phone" placeholder="Phone No" required>
      <select name="blood_group" required>
        <option value="">Blood group</option>
        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
        <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
      </select>
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required>
      <button type="submit">Register</button>
    </form>
    <button type="button" class="backbtn" onclick="show('patientForm')">Back to login</button>
  </div>

  <div id="staffRegister">
    <h2>Registration</h2>
    <form action="/staff_register" method="POST" onsubmit="return checkPass(this)">
      <input type="text" name="name" placeholder="Your name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required>
      <button type="submit">Register</button>
    </form>
    <button type="button" class="backbtn" onclick="show('staffForm')">Back to login</button>
  </div>

</div>
<script>
function show(id) {
  ['roleBox', 'patientForm', 'staffForm', 'patientRegister', 'staffRegister'].forEach(function (x) {
    document.getElementById(x).style.display = (x === id) ? 'block' : 'none';
  });
}
function checkPass(f) {
  if (f.password.value !== f.confirm_password.value) {
    alert('Passwords match nahi karte');
    return false;
  }
  return true;
}
</script>
</body>
</html>
